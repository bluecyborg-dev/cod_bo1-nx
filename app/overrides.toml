# Analysis overrides for default.xex (campaign + Zombies), title 41560855, media 0AEB2159, base version.
#
# Every entry documents why it is needed. Included files use the flat schema (sections at the root).
# Loose keys must stay ABOVE the first [table]: in TOML a key written after [functions] belongs to it,
# and the code generator would ignore it silently.

# --- setjmp / longjmp (CRT) ------------------------------------------------------------------------
# The engine uses them in Com_Error to return to the main loop after a recoverable error. Without them
# the recompiled code cannot unwind and the game ends instead of recovering.
# Found with refs/bo1-recomp/tools/find_setjmp.py on our decrypted image, checked by disassembly:
#   setjmp  0x825FB3A0: checks a hook pointer (lis r4/lwz/bnectr), mflr r0, mfcr r4, then stfd f14..f31 to r3.
#   longjmp 0x825FB7A0: r3 = jmp_buf, r4 = value; lwz r3,0x134(r7) / lwz r4,0x90(r7) / bl 0x82603550 (unwind),
#                       then lfd f14..f31 and ld r13..r31 from the buffer.
# Same code as bo1-recomp's base build (0x825FB540 / 0x825FB940), shifted by -0x1A0, also 0x400 apart.
setjmp_address = 0x825FB3A0
longjmp_address = 0x825FB7A0

# --- Registers as C++ locals ----------------------------------------------------------------------
# The same set bo1-recomp uses on PC for this game:
#   skip_msr          : MSR is only used by interrupt-disable regions
#   ctr_as_local      : CTR never survives a call
#   xer_as_local      : XER is volatile across calls
#   reserved_as_local : the lwarx/stwcx. reservation starts and ends in the same function
#   cr_as_local       : condition registers
# non_volatile_as_local and skip_lr are NOT enabled: setjmp/longjmp (Com_Error) and the SEH blocks need
# r14-r31 and LR in ctx.
skip_msr = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
cr_as_local = true

# Restrict the direct-call ABI optimization to the two active worker routines, their direct callees and their
# callbacks. The stable PPCContext ABI wrappers remain available for indirect job-queue dispatch. Function-level
# A/B targets: sub_825BBB88 (shared readiness/initialization check) and sub_825DF470 (worker processing body).
# Off by default: the focused 30-function candidate showed no measured gain on the Switch (2026-10-18: 19.39 vs
# 19.56 FPS mean, inside run-to-run noise). Set true (and regenerate with tools/codegen.sh) to A/B it again.
args_in_registers = false
args_in_registers_include_file = "args_in_registers_targets.txt"

[functions]
# Filled in from codegen warnings and runtime "Call to invalid or unregistered function" errors.

# 2-instruction leaf setter (stw r4,0x20(r3); blr) right after a bctr, only reached by a tail jump
# (b 0x8239C0D0 from 0x824430A0). Codegen: "UnresolvedCall 0x8239C0D0 - target not in any function".
# It is bo1-recomp's 0x8239BE70 (base 0.0.0.8 build) / 0x82381E28 (TU11).
0x8239C0D0 = { size = 8 }

